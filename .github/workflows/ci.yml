name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, redis
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Verify secret hygiene
        run: |
          ! grep -rE "(SECRET|PASSWORD|API_KEY|PRIVATE_KEY)=" .env.example | grep -v "=null$" | grep -v '=$' && true

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --error-format=github

      - name: Pest (coverage gate 85%)
        run: |
          php -d pcov.enabled=1 -d pcov.directory="$PWD/app" vendor/bin/pest --coverage-text=/tmp/coverage.txt
          php -r '
            $raw = file_get_contents("/tmp/coverage.txt");
            preg_match("/Lines:\s+([0-9.]+)/", strip_tags($raw), $m);
            $lines = (float) ($m[1] ?? 0);
            echo "Coverage lines: {$lines}%\n";
            exit($lines >= 85 ? 0 : 1);
          '

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Audit dependencies
        run: composer audit --locked
      - name: Secret scan
        run: |
          # ponytail: gitleaks ideal; pattern scan sufficient until repo grows
          ! git grep -iE "(api[_-]?key|secret|password)\s*[:=]\s*['\"][A-Za-z0-9/+_-]{16,}" -- . ':!*.lock' ':!*.md'
